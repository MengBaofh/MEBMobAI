# 自定义AI生物配置文件
# 用于配置使用动作系统的自定义AI生物

# 僵尸
zombie:
  # 基础属性
  speed: 1.0
  attack_damage: 3.0
  max_health: 20
  jump_height: 0.5

  # 生物类型（true为敌对生物，会自动攻击目标；false为友好生物，受到攻击后才会攻击目标）
  hostile: true

# 蝙蝠
bat:
  speed: 1.2
  attack_damage: 1.0
  max_health: 6
  jump_height: 0.42
  hostile: false

# 村民
villager:
  speed: 0.8
  attack_damage: 0.0
  max_health: 20
  jump_height: 0.5
  hostile: false

# 全局默认值（当某个生物没有配置时使用）
default:
  speed: 1.0
  attack_damage: 0.0
  max_health: 20
  jump_height: 0.5
  hostile: false
