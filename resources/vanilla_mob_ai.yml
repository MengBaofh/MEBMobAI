# 原版生物AI配置文件
# 此文件用于配置使用MobAIComponent的原版生物AI行为

# 配置格式：
# 生物名称:
#   hostile: true/false        # 是否主动攻击
#   speed: 浮点数              # 移动速度倍数
#   damage: 浮点数             # 攻击伤害
#   jump_height: 浮点数        # 跳跃高度
#   target_types: []           # 攻击目标类型（类名数组）

# 敌对生物
zombie:
  hostile: true
  speed: 1.0
  damage: 3.0
  jump_height: 0.5
  target_types:
    - "pocketmine\\player\\Player"
    - "pocketmine\\Entity\\Villager"

skeleton:
  hostile: true
  speed: 1.2
  damage: 2.5
  jump_height: 0.5
  target_types:
    - "pocketmine\\player\\Player"

creeper:
  hostile: true
  speed: 1.0
  damage: 0.0
  jump_height: 0.5
  target_types:
    - "pocketmine\\player\\Player"

spider:
  hostile: true
  speed: 1.3
  damage: 2.0
  jump_height: 0.8
  target_types:
    - "pocketmine\\player\\Player"

enderman:
  hostile: true
  speed: 1.2
  damage: 7.0
  jump_height: 0.6
  target_types:
    - "pocketmine\\player\\Player"

# 和平生物
pig:
  hostile: false
  speed: 0.8
  damage: 0.0
  jump_height: 0.5
  target_types: []

cow:
  hostile: false
  speed: 0.8
  damage: 0.0
  jump_height: 0.5
  target_types: []

sheep:
  hostile: false
  speed: 0.8
  damage: 0.0
  jump_height: 0.5
  target_types: []

chicken:
  hostile: false
  speed: 0.6
  damage: 0.0
  jump_height: 0.3
  target_types: []

# 飞行生物
bat:
  hostile: false
  speed: 1.2
  damage: 0.0
  jump_height: 0.42
  target_types: []

# 中立生物（受攻击后反击）
wolf:
  hostile: false
  speed: 1.2
  damage: 4.0
  jump_height: 0.6
  target_types:
    - "pocketmine\\player\\Player"

iron_golem:
  hostile: false
  speed: 0.8
  damage: 7.0
  jump_height: 0.5
  target_types:
    - "pocketmine\\player\\Player"

# 全局默认值（当某个原版生物没有配置时使用）
default:
  hostile: false
  speed: 1.0
  damage: 0.0
  jump_height: 0.5
  target_types: []
